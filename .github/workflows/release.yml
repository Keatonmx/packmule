name: Release to App Store Connect

# Manual trigger only. Builds a SIGNED archive on the macOS runner using
# App Store Connect API key auth (no Mac, no local certificates: xcodebuild's
# cloud signing registers bundle IDs and creates profiles on the fly), then
# uploads straight to App Store Connect. The build lands in TestFlight
# automatically once processing finishes.
#
# Required repository secrets:
#   APPLE_TEAM_ID   - from developer.apple.com, Membership page
#   ASC_KEY_ID      - App Store Connect API key ID
#   ASC_ISSUER_ID   - App Store Connect issuer ID
#   ASC_KEY_P8      - the .p8 private key, base64 encoded
#
# The SIDELOAD compilation condition is stripped here, so the personal
# home-server seed does not ship to the public.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Version shown on the store (like 1.0)"
        required: true
        default: "1.0"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # App Store validation requires the current iOS SDK; this lane rides the
    # newest runner image and Xcode while the sideload lane keeps its pin.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: Packmule
      DERIVED: ${{ github.workspace }}/DerivedData
      SPM_CACHE: ${{ github.workspace }}/SourcePackages
      ARCHIVE: ${{ github.workspace }}/Packmule.xcarchive

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -n 1)"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ runner.os }}-${{ hashFiles('Packmule.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Write the App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          # Strip any stray whitespace/CR a Windows-side secret set may carry.
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          test -s "$RUNNER_TEMP/keys/AuthKey.p8"
          head -c 27 "$RUNNER_TEMP/keys/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" && echo "key decodes cleanly"

      - name: Install the signing identity and profiles
        run: |
          printf '%s' "${{ secrets.DIST_P12_B64 }}" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          printf '%s' "${{ secrets.PROFILE_APP_B64 }}" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "${{ secrets.PROFILE_WIDGETS_B64 }}" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/widgets.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          # Default is not enough: codesign only consults the SEARCH LIST.
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "${{ secrets.DIST_P12_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" > /dev/null
          # Xcode 15 reads MobileDevice, Xcode 16 reads Developer/Xcode/UserData;
          # install to both, and name files by profile UUID: the command line
          # matcher has a history of only globbing UUID named files.
          for SRC in "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/widgets.mobileprovision"; do
            UUID=$(security cms -D -i "$SRC" | plutil -extract UUID raw -o - -)
            NAME=$(security cms -D -i "$SRC" | plutil -extract Name raw -o - -)
            echo "installing profile: $NAME ($UUID)"
            for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$DIR"
              cp "$SRC" "$DIR/$UUID.mobileprovision"
            done
          done
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build (unsigned, the proven lane)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Packmule.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ github.event.inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited)' \
            2>&1 | tee xcodebuild-archive.log | (grep -E "error:|BUILD " || true)
          test -x "$DERIVED/Build/Products/Release-iphoneos/Packmule.app/Packmule"

      - name: Sign by hand (codesign, inside out) and pack the IPA
        run: |
          set -euo pipefail
          APP="$DERIVED/Build/Products/Release-iphoneos/Packmule.app"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Apple Distribution/ {print $2; exit}')
          echo "signing with identity $IDENTITY"

          # Embed the profiles where iOS expects them.
          cp "$RUNNER_TEMP/app.mobileprovision" "$APP/embedded.mobileprovision"
          cp "$RUNNER_TEMP/widgets.mobileprovision" "$APP/PlugIns/PackmuleWidgets.appex/embedded.mobileprovision"

          # Each bundle signs with the exact entitlements its profile grants.
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/app-ents.plist" "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/widgets.mobileprovision" > "$RUNNER_TEMP/widgets-profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/widgets-ents.plist" "$RUNNER_TEMP/widgets-profile.plist"

          # Inside out: frameworks, then the extension, then the app seals it.
          for FW in "$APP/Frameworks/"*; do
            [ -e "$FW" ] || continue
            codesign --force --sign "$IDENTITY" --timestamp=none "$FW"
          done
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/widgets-ents.plist" \
            --timestamp=none "$APP/PlugIns/PackmuleWidgets.appex"
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/app-ents.plist" \
            --timestamp=none "$APP"
          codesign --verify --deep --strict "$APP"
          echo "signature verifies"

          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Packmule-signed.ipa Payload)
          ls -la Packmule-signed.ipa

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          # altool reads API keys from ~/private_keys by convention.
          mkdir -p "$HOME/private_keys"
          cp "$RUNNER_TEMP/keys/AuthKey.p8" "$HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"
          # Newer Xcodes dropped altool; borrow it from an older install if needed.
          if xcrun -f altool > /dev/null 2>&1; then
            UPLOAD="xcrun altool"
          else
            OLD=$(ls -d /Applications/Xcode_1[5-9]*.app 2>/dev/null | sort -V | tail -n 1)
            echo "altool missing in selected Xcode, borrowing from: $OLD"
            UPLOAD="env DEVELOPER_DIR=$OLD xcrun altool"
          fi
          $UPLOAD --upload-app -f Packmule-signed.ipa -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" \
            2>&1 | tee xcodebuild-export.log | (grep -vE "^\s*$" | tail -n 20)

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            xcodebuild-archive.log
            xcodebuild-export.log
          if-no-files-found: ignore
